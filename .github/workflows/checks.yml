name: Source checks (manual or PR)
on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  public-quality:
    name: public-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / node24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 / node24
        with:
          python-version: '3.12'
      - name: Product, privacy and distribution integrity
        run: python -B scripts/check_public.py
      - name: Browser journeys and resource navigation
        timeout-minutes: 5
        run: node tests/hub_experience_browser.cjs hub/site "$(command -v google-chrome)" "$RUNNER_TEMP/muse-hub-browser-${{ github.run_id }}-${{ github.run_attempt }}" --require-journeys
  source-tests:
    name: source-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / node24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 / node24
        with:
          python-version: '3.12'
      - name: Run source tests
        run: python -m unittest discover -s tests -v
      - name: Public distribution neutrality and privacy
        run: python -m muse_presets.cli audit-neutrality
      - name: Doctor
        run: python -B -m muse_presets.cli doctor
      - name: Verify all 15 specialist kits
        run: python -B examples/github_quickstart.py --all
  checks:
    name: checks
    if: ${{ always() }}
    needs: [source-tests, public-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / node24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 / node24
        with:
          python-version: '3.12'
      - name: Require Linux, Windows and product-quality checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python -B scripts/check_ci_results.py
